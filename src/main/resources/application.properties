spring.application.name=ventas

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ventas?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver