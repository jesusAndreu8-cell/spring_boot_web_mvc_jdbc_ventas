<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Comerciales')}"></head>
<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <h1 class="h2 mb-0">Comerciales</h1>
            <a class="btn btn-primary" th:href="@{/comerciales/crear}">Crear comercial</a>
        </div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Nombre</th><th>Apellido 1</th><th>Apellido 2</th><th>Comisión</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="comercial : ${comerciales}">
                        <td th:text="${comercial.id}">0</td>
                        <td th:text="${comercial.nombre}">nombre</td>
                        <td th:text="${comercial.apellido1}">apellido1</td>
                        <td th:text="${comercial.apellido2 ?: '-'}">apellido2</td>
                        <td th:text="${comercial.comisión ?: '-'}">comisión</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <form th:action="@{/comerciales/{id}(id=${comercial.id})}" method="post"><button class="btn btn-sm btn-outline-primary" type="submit">Ver detalle</button></form>
                                <form th:action="@{/comerciales/editar/{id}(id=${comercial.id})}" method="get"><button class="btn btn-sm btn-outline-secondary" type="submit">Editar</button></form>
                                <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button></form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
