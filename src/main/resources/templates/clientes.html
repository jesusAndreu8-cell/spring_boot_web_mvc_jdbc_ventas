<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <style>
        #contenedora {
            margin: 0 auto;
            width: 95%;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .table-container {
            overflow-x: auto;
        }

        .clientes-table {
            display: table;
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .clientes-row {
            display: table-row;
        }

        .clientes-header {
            background: #e9eef2;
            font-weight: bold;
        }

        .clientes-cell {
            display: table-cell;
            padding: 0.7rem 0.6rem;
            border-bottom: 1px solid #ccd4da;
            text-align: left;
            vertical-align: middle;
            overflow-wrap: anywhere;
        }

        .clientes-cell:nth-child(1) { width: 6%; }
        .clientes-cell:nth-child(2),
        .clientes-cell:nth-child(3),
        .clientes-cell:nth-child(4),
        .clientes-cell:nth-child(5) { width: 13%; }
        .clientes-cell:nth-child(6) { width: 12%; }
        .clientes-cell:nth-child(7) { width: 30%; }

        .clientes-row:not(.clientes-header):hover {
            background: #f5f8fa;
        }

        .clientes-actions {
            white-space: normal;
        }

        .clientes-actions form {
            display: block;
            margin-bottom: 0.25rem;
        }

        .clientes-actions input {
            box-sizing: border-box;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div id="contenedora">
        <div class="page-header">
            <div>
                <h1>Clientes</h1>
            </div>
            <div>
                <form action="/clientes/crear">
                    <input type="submit" value="Crear">
                </form>
            </div>
        </div>
        <div class="table-container">
            <div class="clientes-table">
                <div class="clientes-row clientes-header">
                    <div class="clientes-cell">ID</div>
                    <div class="clientes-cell">Nombre</div>
                    <div class="clientes-cell">Apellido1</div>
                    <div class="clientes-cell">Apellido2</div>
                    <div class="clientes-cell">Ciudad</div>
                    <div class="clientes-cell">Categoría</div>
                    <div class="clientes-cell">Acciones</div>
                </div>
                <div class="clientes-row" th:each="cliente : ${clientes}">
                    <div class="clientes-cell" th:text="${cliente.id}">0</div>
                    <div class="clientes-cell" th:text="${cliente.nombre}">nombre</div>
                    <div class="clientes-cell" th:text="${cliente.apellido1}">apellido1</div>
                    <div class="clientes-cell" th:text="${cliente.apellido2 ?: '-'}">apellido2</div>
                    <div class="clientes-cell" th:text="${cliente.ciudad}">ciudad</div>
                    <div class="clientes-cell" th:text="${cliente.categoría}">categoría</div>
                    <div class="clientes-cell clientes-actions">
                        <form th:action="@{/clientes/{id}(id=${cliente.id})}" method="post">
                            <input type="submit" value="Ver Detalle"/>
                        </form>
                        <form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" method="get">
                            <input type="submit" value="Editar" />
                        </form>
                        <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
                            <input type="submit" value="Eliminar" />
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
